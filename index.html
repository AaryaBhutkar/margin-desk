<!doctype html>
<!--
  `data-theme` selects the Margin palette in src/themes.css. The inline script
  below sets `data-ui-theme` (light or dark) before first paint.
-->
<html lang="en" data-theme="margin" data-ui-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="A little research. A clearer decision. Gather evidence, inspect the tradeoffs, and write a brief with sources you can follow."
    />
    <meta name="robots" content="noindex, nofollow" />
    <title>Margin — A decision desk</title>
    <!--
      First-paint background, keyed to the data-theme attribute above.
      Without this the browser paints white until the CSS bundle arrives —
      a hard flash on the dark themes. Each value mirrors --color-background
      in src/styles.css (slate) / src/themes.css; keep them in sync when
      adding or editing themes.
    -->
    <style>
      html {
        background-color: #f7f7ef;
        color-scheme: light;
      }
      html[data-ui-theme='dark'] {
        background-color: #181813;
        color-scheme: dark;
      }
    </style>
    <script>
      // Apply the saved or system color mode before first paint. The same rule
      // lives in resolveColorMode (src/color-mode.ts); keep the key in sync.
      var marginMode = null
      try {
        marginMode = localStorage.getItem('margin:color-mode')
      } catch (e) {}
      document.documentElement.dataset.uiTheme =
        marginMode === 'dark' ||
        (marginMode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          ? 'dark'
          : 'light'
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
